[pytest]
# Pytest configuration for Memex test suite

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Test markers
markers =
    integration: Integration tests requiring external services (deselect with '-m "not integration"')
    slow: Slow-running tests (deselect with '-m "not slow"')
    asyncio: Async tests using pytest-asyncio

# Async support
asyncio_mode = auto

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=memex --cov-report=html --cov-report=term

# Minimum Python version
minversion = 3.9

# Test paths
testpaths = .

# Ignore paths
norecursedirs = .git .tox dist build *.egg __pycache__

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG
